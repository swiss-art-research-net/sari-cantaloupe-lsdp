<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LSDP IIIF Viewer</title>

  <script src="https://unpkg.com/mirador@latest/dist/mirador.min.js"></script>

  <style>
    html, body, #viewer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
  </style>
</head>
<body>

<div id="viewer"></div>

<script>
async function initMirador() {
  const response = await fetch('http://localhost:8000/manifests.json');
  const manifests = await response.json();

  Mirador.viewer({
    id: "viewer",
    windows: manifests.map(m => ({ manifestId: m }))
  });
}

initMirador();
</script>

</body>
</html>
